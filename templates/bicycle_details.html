
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bicycle Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        @media (max-width: 576px) {
            body.container {
                margin-top: 20px !important;
                padding-left: 12px;
                padding-right: 12px;
            }

            h2 {
                font-size: 23px;
                overflow-wrap: anywhere;
            }

            h5 {
                font-size: 16px;
            }

            .parts-table th,
            .parts-table td {
                padding: 8px 6px;
                font-size: 14px;
                vertical-align: middle;
            }

            .parts-table .btn {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body class="container mt-5">

    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>

    <h2 class="mt-3">{{ bicycle.name }}</h2>
    <h5>Overall Status: {{ bicycle.status }}</h5>

    <div class="table-responsive mt-4">
        <table class="table table-bordered parts-table mb-0">
            <tr>
                <th>Part</th>
                <th>Quantity</th>
                <th>Stage</th>
                <th>Action</th>
            </tr>

            {% for part in parts %}
            <tr>
                <td>{{ part.name }}</td>
                <td>{{ part.quantity }}</td>
                <td>{{ part.stage }}</td>
                <td>
                    {% if part.stage != "Done" %}
                    <form method="POST">
                        <input type="hidden" name="part_id"
                               value="{{ part.id }}">
                        <button class="btn btn-primary btn-sm">
                            Next Stage
                        </button>
                    </form>
                    {% else %}
                        Completed
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>

</body>
</html>
