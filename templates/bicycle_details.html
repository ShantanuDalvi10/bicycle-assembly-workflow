
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bicycle Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>

    <h2 class="mt-3">{{ bicycle.name }}</h2>
    <h5>Overall Status: {{ bicycle.status }}</h5>

    <table class="table table-bordered mt-4">
        <tr>
            <th>Part</th>
            <th>Quantity</th>
            <th>Stage</th>
            <th>Action</th>
        </tr>

        {% for part in parts %}
        <tr>
            <td>{{ part.name }}</td>
            <td>{{ part.quantity }}</td>
            <td>{{ part.stage }}</td>
            <td>
                {% if part.stage != "Done" %}
                <form method="POST">
                    <input type="hidden" name="part_id"
                           value="{{ part.id }}">
                    <button class="btn btn-primary btn-sm">
                        Next Stage
                    </button>
                </form>
                {% else %}
                    Completed
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
