
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Bicycle Workflow App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 12px;
        }

        .register-card {
            width: 100%;
            max-width: 450px;
            border: none;
            border-radius: 15px;
        }

        .card-body {
            padding: 30px;
        }

        .form-control {
            min-height: 46px;
            font-size: 16px;
            border-radius: 8px;
        }

        .btn-register {
            min-height: 48px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
        }

        /* Mobile screen adjustments */
        @media (max-width: 576px) {
            body {
                padding: 15px 12px;
            }

            .card-body {
                padding: 22px 18px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card register-card shadow">
                <div class="card-body p-4">

                    <h2 class="text-center mb-4">Create Account</h2>

                    {% for message in get_flashed_messages() %}
                        <div class="alert alert-danger">
                            {{ message }}
                        </div>
                    {% endfor %}

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   placeholder="Enter username"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter password"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-primary btn-register w-100">
                            Register
                        </button>

                    </form>

                    <p class="text-center mt-3">
                        Already have an account?
                        <a href="{{ url_for('login') }}">Login</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
